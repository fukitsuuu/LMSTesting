<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enrollment</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../assets/css/theme.css" rel="stylesheet">
</head>
<body>
<main class="app-main">

  <div id="pageActionSource" hidden>
    <button class="btn btn-soft btn-sm" data-demo-action="Bulk import accepts a CSV of student numbers. Display only in this UI demo.">
      <i class="bi bi-upload me-1"></i>Bulk import
    </button>
    <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#addEnrollment">
      <i class="bi bi-person-plus me-1"></i>Add students
    </button>
  </div>

  <div class="row g-3 mb-3">
    <div class="col-6 col-lg-3"><div class="card stat-card"><div class="stat-label">Total enrolments</div><div class="stat-value">157</div></div></div>
    <div class="col-6 col-lg-3"><div class="card stat-card"><div class="stat-label">In progress</div><div class="stat-value">94</div></div></div>
    <div class="col-6 col-lg-3"><div class="card stat-card"><div class="stat-label">Completed</div><div class="stat-value">49</div></div></div>
    <div class="col-6 col-lg-3"><div class="card stat-card"><div class="stat-label">At risk</div><div class="stat-value">14</div></div></div>
  </div>

  <div class="card">
    <div class="card-header d-flex flex-wrap justify-content-between align-items-center gap-2">
      <span>Enrolment records</span>
      <select class="form-select form-select-sm" id="courseFilter" style="width:240px">
        <option value="">All courses</option>
      </select>
    </div>
    <div class="table-responsive">
      <table class="table table-hover mb-0">
        <thead>
          <tr><th>Enrolment ID</th><th>Student</th><th>Course</th><th>Date enrolled</th><th>Progress</th><th>Status</th><th class="text-end">Actions</th></tr>
        </thead>
        <tbody id="enrollRows"></tbody>
      </table>
    </div>
  </div>

  <div class="modal fade" id="addEnrollment" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <form data-demo-form="Students enrolled. This UI demo does not store records." novalidate>
          <div class="modal-header">
            <h5 class="modal-title" style="font-size:1rem;color:var(--lms-navy)">Add students to a course</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="row g-3 mb-3">
              <div class="col-md-8">
                <label class="form-label" for="eCourse">Course</label>
                <select class="form-select" id="eCourse" required></select>
              </div>
              <div class="col-md-4">
                <label class="form-label" for="eDate">Enrolment date</label>
                <input type="date" class="form-control" id="eDate" value="2026-08-20">
              </div>
            </div>

            <label class="form-label">Select students</label>
            <div class="border rounded" style="max-height:240px;overflow-y:auto">
              <table class="table table-sm table-hover mb-0">
                <thead><tr><th style="width:40px"></th><th>Student</th><th>Student number</th><th>Department</th></tr></thead>
                <tbody id="studentPicker"></tbody>
              </table>
            </div>
            <div class="form-text">Enrolled students receive an email notification and appear in the course roster.</div>

            <div class="form-check mt-3">
              <input class="form-check-input" type="checkbox" id="eNotify" checked>
              <label class="form-check-label" for="eNotify">Send enrolment notification email</label>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Enrol selected students</button>
          </div>
        </form>
      </div>
    </div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/layout.js"></script>
<script>
LMS.initPage({
  id: 'enrollment',
  title: 'Enrollment',
  sub: 'Assign students to courses and monitor enrolment status',
  perm: 'enroll.manage',
  breadcrumb: [{ label: 'Administration', href: 'dashboard.html' }, { label: 'Enrollment' }]
});

(function () {
  const filter = document.getElementById('courseFilter');
  LMSData.courses.forEach(c => filter.insertAdjacentHTML('beforeend', '<option>' + c.title + '</option>'));

  function draw() {
    const course = filter.value;
    const list = LMSData.enrollments.filter(e => !course || e.course === course);
    LMS.render('#enrollRows', list.map(e =>
      '<tr>' +
        '<td class="text-muted-sm">' + e.id + '</td>' +
        '<td><div class="fw-semibold">' + e.student + '</div><div class="text-muted-sm">' + e.studentId + '</div></td>' +
        '<td>' + e.course + '</td>' +
        '<td class="text-muted-sm">' + e.enrolled + '</td>' +
        '<td style="min-width:140px">' + LMS.progressBar(e.progress) + '</td>' +
        '<td>' + LMS.statusBadge(e.status) + '</td>' +
        '<td class="text-end">' +
          '<button class="btn btn-sm btn-outline-primary py-0 px-2" data-demo-action="Enrolment detail opens here. Display only in this UI demo."><i class="bi bi-eye"></i></button> ' +
          '<button class="btn btn-sm btn-outline-secondary py-0 px-2" data-demo-action="Unenrolment is display-only in this UI demo."><i class="bi bi-person-dash"></i></button>' +
        '</td>' +
      '</tr>').join('') || '<tr><td colspan="7" class="text-center text-muted py-4">No enrolments for this course.</td></tr>');
  }
  filter.addEventListener('change', draw);
  draw();

  document.getElementById('eCourse').innerHTML = LMSData.courses.map(c => '<option>' + c.title + '</option>').join('');
  LMS.render('#studentPicker', LMSData.users.filter(u => u.role === 'student').map((s, i) =>
    '<tr>' +
      '<td><input class="form-check-input" type="checkbox" id="sp' + i + '"></td>' +
      '<td><label class="form-check-label" for="sp' + i + '">' + s.name + '</label></td>' +
      '<td class="text-muted-sm">' + s.id + '</td>' +
      '<td class="text-muted-sm">' + s.dept + '</td>' +
    '</tr>').join(''));
})();
</script>
</body>
</html>
