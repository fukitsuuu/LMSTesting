<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assignments</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../assets/css/theme.css" rel="stylesheet">
</head>
<body>
<main class="app-main">

  <div id="pageActionSource" hidden>
    <a href="assignment-grade.html" class="btn btn-soft btn-sm" data-perm="grade"><i class="bi bi-clipboard-check me-1"></i>Grade submissions</a>
    <button class="btn btn-primary btn-sm" data-perm="assignment.manage" data-bs-toggle="modal" data-bs-target="#addAssignment">
      <i class="bi bi-plus-lg me-1"></i>Create assignment
    </button>
  </div>

  <div class="card mb-3">
    <div class="card-header">Assignments</div>
    <div class="table-responsive">
      <table class="table table-hover mb-0">
        <thead>
          <tr><th>Assignment</th><th>Course</th><th>Due date</th><th>Points</th><th>Submitted</th><th>Graded</th><th>Status</th><th class="text-end">Actions</th></tr>
        </thead>
        <tbody id="assignRows"></tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      <span>Recent submissions</span>
      <a href="assignment-grade.html" class="small text-decoration-none" data-perm="grade">Open grading queue</a>
    </div>
    <div class="table-responsive">
      <table class="table table-hover mb-0">
        <thead><tr><th>Student</th><th>Assignment</th><th>File</th><th>Submitted</th><th>Status</th><th>Score</th></tr></thead>
        <tbody id="subRows"></tbody>
      </table>
    </div>
  </div>

  <div class="modal fade" id="addAssignment" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form data-demo-form="Assignment created. This UI demo does not store records." novalidate>
          <div class="modal-header">
            <h5 class="modal-title" style="font-size:1rem;color:var(--lms-navy)">Create assignment</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label" for="aTitle">Assignment title</label>
              <input class="form-control" id="aTitle" required>
            </div>
            <div class="mb-3">
              <label class="form-label" for="aCourse">Course</label>
              <select class="form-select" id="aCourse"></select>
            </div>
            <div class="mb-3">
              <label class="form-label" for="aInstructions">Instructions</label>
              <textarea class="form-control" id="aInstructions" rows="3"></textarea>
            </div>
            <div class="row g-3 mb-3">
              <div class="col-6">
                <label class="form-label" for="aDue">Due date</label>
                <input type="date" class="form-control" id="aDue" value="2026-09-04">
              </div>
              <div class="col-6">
                <label class="form-label" for="aPoints">Points</label>
                <input type="number" class="form-control" id="aPoints" value="50">
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label" for="aFormats">Accepted file types</label>
              <input class="form-control" id="aFormats" value="PDF, DOCX, JPG">
              <div class="form-text">Uploads are validated before they are accepted.</div>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="aLate" checked>
              <label class="form-check-label" for="aLate">Accept late submissions and flag them</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="aRequired" checked>
              <label class="form-check-label" for="aRequired">Required for course completion</label>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Create assignment</button>
          </div>
        </form>
      </div>
    </div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/layout.js"></script>
<script>
LMS.initPage({
  id: 'assignments',
  title: 'Assignments',
  sub: 'Assignment submission and grading',
  anyOf: ['assignment.manage', 'grade'],
  breadcrumb: [{ label: 'Learning', href: 'dashboard.html' }, { label: 'Assignments' }]
});

(function () {
  const canGrade = LMSAuth.can('grade');
  const canManage = LMSAuth.can('assignment.manage');

  LMS.render('#assignRows', LMSData.assignments.map(a => {
    let actions = '';
    if (canManage) actions += '<button class="btn btn-sm btn-outline-primary py-0 px-2" data-demo-action="Assignment editor opens here."><i class="bi bi-pencil"></i></button> ';
    if (canGrade) actions += '<a href="assignment-grade.html" class="btn btn-sm btn-outline-primary py-0 px-2"><i class="bi bi-clipboard-check"></i></a>';
    if (!actions) actions = '<span class="text-muted-sm"><i class="bi bi-eye"></i> View only</span>';
    return '<tr>' +
      '<td class="fw-semibold">' + a.title + '</td>' +
      '<td class="text-muted-sm">' + a.course + '</td>' +
      '<td class="text-muted-sm">' + a.due + '</td>' +
      '<td>' + a.points + '</td>' +
      '<td>' + a.submitted + '</td>' +
      '<td>' + a.graded + '</td>' +
      '<td>' + LMS.statusBadge(a.status) + '</td>' +
      '<td class="text-end">' + actions + '</td>' +
    '</tr>';
  }).join(''));

  LMS.render('#subRows', LMSData.submissions.map(s =>
    '<tr>' +
      '<td><div class="fw-semibold">' + s.student + '</div><div class="text-muted-sm">' + s.studentId + '</div></td>' +
      '<td class="text-muted-sm">' + s.assignment + '</td>' +
      '<td class="text-muted-sm"><i class="bi bi-paperclip me-1"></i>' + s.file + ' <span class="text-muted">(' + s.size + ')</span></td>' +
      '<td class="text-muted-sm">' + s.submitted + '</td>' +
      '<td>' + LMS.statusBadge(s.status) + '</td>' +
      '<td>' + (s.score !== null ? '<span class="fw-semibold">' + s.score + '</span>' : '<span class="text-muted-sm">Not graded</span>') + '</td>' +
    '</tr>').join(''));

  const sel = document.getElementById('aCourse');
  if (sel) sel.innerHTML = LMSData.courses.map(c => '<option>' + c.title + '</option>').join('');
})();
</script>
</body>
</html>
