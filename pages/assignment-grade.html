<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grade Assignments</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../assets/css/theme.css" rel="stylesheet">
</head>
<body>
<main class="app-main">

  <div id="pageActionSource" hidden>
    <a href="assignments.html" class="btn btn-outline-secondary btn-sm">Back to assignments</a>
  </div>

  <div class="row g-3">
    <div class="col-lg-5">
      <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <span>Submission inbox</span>
          <select class="form-select form-select-sm" style="width:130px">
            <option>All</option><option>Ungraded</option><option>Graded</option><option>Late</option>
          </select>
        </div>
        <div class="list-group list-group-flush" id="inbox"></div>
      </div>
    </div>

    <div class="col-lg-7">
      <div class="card">
        <div class="card-header">Workplace Hazard Observation Report &mdash; Jasmine Torres</div>
        <div class="card-body">
          <div class="row g-3 mb-3">
            <div class="col-md-4"><div class="text-muted-sm">Submitted</div><div class="fw-semibold small">19 Aug 2026, 21:04</div></div>
            <div class="col-md-4"><div class="text-muted-sm">Due</div><div class="fw-semibold small">28 Aug 2026</div></div>
            <div class="col-md-4"><div class="text-muted-sm">Attempt</div><div class="fw-semibold small">1 of 1</div></div>
          </div>

          <div class="border rounded p-3 mb-3 d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-2">
              <i class="bi bi-file-earmark-pdf fs-3 text-danger"></i>
              <div>
                <div class="fw-semibold small">hazard-report-torres.pdf</div>
                <div class="text-muted-sm">1.2 MB &middot; uploaded 19 Aug 2026</div>
              </div>
            </div>
            <button class="btn btn-sm btn-outline-primary" data-demo-action="File preview opens here. No real file in this UI demo.">
              <i class="bi bi-eye me-1"></i>Preview
            </button>
          </div>

          <form data-demo-form="Assignment graded and learner notified. This UI demo does not store records." novalidate>
            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label" for="score">Score</label>
                <div class="input-group"><input type="number" class="form-control" id="score" value="46"><span class="input-group-text">of 50</span></div>
              </div>
              <div class="col-md-4">
                <label class="form-label" for="status">Status</label>
                <select class="form-select" id="status"><option>Graded</option><option>Needs revision</option><option>Rejected</option></select>
              </div>
              <div class="col-md-4">
                <label class="form-label" for="rubric">Rubric</label>
                <select class="form-select" id="rubric"><option>Standard observation rubric</option><option>None</option></select>
              </div>
              <div class="col-12">
                <label class="form-label" for="comments">Feedback</label>
                <textarea class="form-control" id="comments" rows="3">Clear identification of hazards. Add the corrective action timeline in the next submission.</textarea>
              </div>
              <div class="col-12">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="notify" checked>
                  <label class="form-check-label" for="notify">Email the learner once the grade is saved</label>
                </div>
              </div>
              <div class="col-12 d-flex gap-2">
                <button type="submit" class="btn btn-primary"><i class="bi bi-check2 me-1"></i>Save grade</button>
                <button type="button" class="btn btn-outline-secondary" data-demo-action="Moved to the next ungraded submission.">Save and next</button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/layout.js"></script>
<script>
LMS.initPage({
  id: 'assignments',
  title: 'Grade Assignments',
  sub: 'Review submitted files and record scores',
  perm: 'grade',
  breadcrumb: [{ label: 'Learning', href: 'dashboard.html' }, { label: 'Assignments', href: 'assignments.html' }, { label: 'Grade Assignments' }]
});

(function () {
  LMS.render('#inbox', LMSData.submissions.map((s, i) =>
    '<a href="#" class="list-group-item list-group-item-action" ' +
      'style="' + (i === 0 ? 'background:var(--lms-blue-50)' : '') + '" data-demo-action="Loading submission from ' + s.student + '.">' +
      '<div class="d-flex justify-content-between align-items-start">' +
        '<div>' +
          '<div class="fw-semibold">' + s.student + '</div>' +
          '<div class="text-muted-sm">' + s.assignment + '</div>' +
          '<div class="text-muted-sm"><i class="bi bi-paperclip"></i> ' + s.file + '</div>' +
        '</div>' +
        '<div class="text-end">' + LMS.statusBadge(s.status) +
          (s.score !== null ? '<div class="fw-semibold mt-1">' + s.score + '/50</div>' : '') +
        '</div>' +
      '</div>' +
    '</a>').join(''));
})();
</script>
</body>
</html>
