<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>User Management</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../assets/css/theme.css" rel="stylesheet">
</head>
<body>
<main class="app-main">

  <div id="pageActionSource" hidden>
    <button class="btn btn-soft btn-sm" data-perm="reports.export" data-demo-action="User list export started (CSV). Files are not generated in this UI demo.">
      <i class="bi bi-download me-1"></i>Export list
    </button>
    <a href="user-form.html" class="btn btn-primary btn-sm" data-perm="users.create"><i class="bi bi-person-plus me-1"></i>Add account</a>
  </div>

  <div class="card mb-3" data-perm="users.create">
    <div class="card-body py-3">
      <div class="d-flex align-items-start gap-2">
        <i class="bi bi-shield-check fs-5" style="color:var(--lms-blue)"></i>
        <div>
          <div class="fw-semibold" style="color:var(--lms-navy);font-size:.88rem">Account creation scope for your role</div>
          <div class="text-muted-sm" id="scopeNote"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="row g-3 mb-3" id="roleCounts"></div>

  <div class="card">
    <div class="card-header d-flex flex-wrap justify-content-between align-items-center gap-2">
      <span>All user accounts</span>
      <div class="d-flex gap-2">
        <input type="search" class="form-control form-control-sm" id="searchBox" placeholder="Search name or email" style="width:210px">
        <select class="form-select form-select-sm" id="roleFilter" style="width:190px">
          <option value="">All roles</option>
        </select>
      </div>
    </div>
    <div class="table-responsive">
      <table class="table table-hover mb-0">
        <thead>
          <tr>
            <th>User</th><th>ID</th><th>Role</th><th>Department</th>
            <th>Status</th><th>Last sign-in</th><th class="text-end">Actions</th>
          </tr>
        </thead>
        <tbody id="userRows"></tbody>
      </table>
    </div>
    <div class="card-body border-top py-2 d-flex justify-content-between align-items-center">
      <span class="text-muted-sm" id="rowCount"></span>
      <nav>
        <ul class="pagination pagination-sm mb-0">
          <li class="page-item disabled"><a class="page-link" href="#">Previous</a></li>
          <li class="page-item active"><a class="page-link" href="#">1</a></li>
          <li class="page-item"><a class="page-link" href="#" data-demo-action="Pagination is display-only in this UI demo.">2</a></li>
          <li class="page-item"><a class="page-link" href="#" data-demo-action="Pagination is display-only in this UI demo.">Next</a></li>
        </ul>
      </nav>
    </div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/layout.js"></script>
<script>
LMS.initPage({
  id: 'users',
  title: 'User Management',
  sub: 'Accounts for system administration, managers, administrators, teachers, and students',
  perm: 'users.view',
  breadcrumb: [{ label: 'Administration', href: 'dashboard.html' }, { label: 'User Management' }]
});

(function () {
  const creatable = LMSAuth.creatableRoles();
  const scope = document.getElementById('scopeNote');
  if (scope) {
    scope.innerHTML = creatable.length
      ? 'You may create: <strong>' + creatable.map(LMSAuth.roleLabel).join(', ') + '</strong>. Other role levels are not available to you.'
      : 'Your role cannot create accounts.';
  }

  const counts = {};
  LMSData.users.forEach(u => { counts[u.role] = (counts[u.role] || 0) + 1; });
  const icons = {
    sysadmin: 'bi-shield-lock', manager: 'bi-diagram-3', administrator: 'bi-person-badge',
    editing_teacher: 'bi-pencil-square', non_editing_teacher: 'bi-eye', student: 'bi-mortarboard'
  };
  LMS.render('#roleCounts', Object.keys(LMSAuth.roles).map(key =>
    '<div class="col-6 col-lg-2"><div class="card stat-card h-100 text-center">' +
      '<div class="stat-icon mx-auto mb-2"><i class="bi ' + icons[key] + '"></i></div>' +
      '<div class="stat-value" style="font-size:1.3rem">' + (counts[key] || 0) + '</div>' +
      '<div class="text-muted-sm">' + LMSAuth.roleLabel(key) + '</div>' +
    '</div></div>').join(''));

  const filter = document.getElementById('roleFilter');
  Object.keys(LMSAuth.roles).forEach(key => {
    filter.insertAdjacentHTML('beforeend', '<option value="' + key + '">' + LMSAuth.roleLabel(key) + '</option>');
  });

  function draw() {
    const term = document.getElementById('searchBox').value.toLowerCase();
    const role = filter.value;
    const list = LMSData.users.filter(u =>
      (!role || u.role === role) &&
      (!term || u.name.toLowerCase().includes(term) || u.email.toLowerCase().includes(term)));

    LMS.render('#userRows', list.map(u => {
      const editable = creatable.indexOf(u.role) !== -1;
      const actions = editable
        ? '<a href="user-form.html?id=' + u.id + '" class="btn btn-sm btn-outline-primary py-0 px-2"><i class="bi bi-pencil"></i></a> ' +
          '<button class="btn btn-sm btn-outline-secondary py-0 px-2" data-demo-action="Account status change is display-only in this UI demo."><i class="bi bi-toggle-off"></i></button>'
        : '<span class="text-muted-sm"><i class="bi bi-lock"></i> No permission</span>';
      return '<tr>' +
        '<td><div class="d-flex align-items-center gap-2"><span class="avatar-circle">' + LMSAuth.initials(u.name) + '</span>' +
          '<div><div class="fw-semibold">' + u.name + '</div><div class="text-muted-sm">' + u.email + '</div></div></div></td>' +
        '<td class="text-muted-sm">' + u.id + '</td>' +
        '<td>' + LMS.badge(LMSAuth.roleLabel(u.role), 'blue') + '</td>' +
        '<td class="text-muted-sm">' + u.dept + '</td>' +
        '<td>' + LMS.statusBadge(u.status) + '</td>' +
        '<td class="text-muted-sm">' + u.last + '</td>' +
        '<td class="text-end">' + actions + '</td>' +
      '</tr>';
    }).join('') || '<tr><td colspan="7" class="text-center text-muted py-4">No accounts match your filter.</td></tr>');

    document.getElementById('rowCount').textContent = 'Showing ' + list.length + ' of ' + LMSData.users.length + ' accounts';
  }

  document.getElementById('searchBox').addEventListener('input', draw);
  filter.addEventListener('change', draw);
  draw();
})();
</script>
</body>
</html>
