<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Email OTP Verification | Far East e-Learning LMS</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="assets/css/theme.css" rel="stylesheet">
</head>
<body class="auth-body">

<div class="auth-wrap shadow" style="max-width:520px;grid-template-columns:1fr">
  <div class="auth-form">
    <div class="d-flex align-items-center gap-2 mb-4">
      <div class="auth-mark">FE</div>
      <div>
        <div class="fw-semibold" style="color:var(--lms-navy)">Two-step verification</div>
        <div class="text-muted-sm">Email one-time password</div>
      </div>
    </div>

    <p class="mb-1" style="font-size:.88rem">We sent a 6-digit one-time password to</p>
    <p class="fw-semibold mb-4" id="maskedEmail" style="color:var(--lms-blue-dark)"></p>

    <form id="otpForm" novalidate>
      <label class="form-label" for="otp">One-time password</label>
      <input type="text" class="form-control otp-input mb-2" id="otp" maxlength="6" inputmode="numeric"
             placeholder="------" autocomplete="one-time-code" required>
      <div class="small text-danger mb-2" id="otpError" hidden>Invalid code. The demo code is 246810.</div>

      <div class="d-flex justify-content-between align-items-center mb-4">
        <span class="text-muted-sm">Code expires in <span id="countdown">04:59</span></span>
        <a href="#" class="small text-decoration-none" id="resend">Resend code</a>
      </div>

      <button class="btn btn-primary w-100 py-2 mb-2" type="submit">Verify and sign in</button>
      <a href="index.html" class="btn btn-link w-100 text-decoration-none small">Back to sign in</a>
    </form>

    <div class="demo-note mt-3">
      <i class="bi bi-key me-1"></i> Demo code: <strong>246810</strong>. No email is actually sent.
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/auth.js"></script>
<script>
  const pending = LMSAuth.getPending();
  if (!pending) window.location.href = 'index.html';

  const parts = pending.email.split('@');
  document.getElementById('maskedEmail').textContent =
    parts[0].slice(0, 2) + '*'.repeat(Math.max(parts[0].length - 2, 3)) + '@' + parts[1];

  let seconds = 299;
  setInterval(function () {
    if (seconds <= 0) return;
    seconds--;
    const m = String(Math.floor(seconds / 60)).padStart(2, '0');
    const s = String(seconds % 60).padStart(2, '0');
    document.getElementById('countdown').textContent = m + ':' + s;
  }, 1000);

  document.getElementById('resend').addEventListener('click', function (ev) {
    ev.preventDefault();
    seconds = 299;
    this.textContent = 'Code resent';
    setTimeout(() => { this.textContent = 'Resend code'; }, 2500);
  });

  document.getElementById('otpForm').addEventListener('submit', function (ev) {
    ev.preventDefault();
    const code = document.getElementById('otp').value.trim();
    if (code !== '246810') {
      document.getElementById('otpError').hidden = false;
      return;
    }
    const user = LMSAuth.confirmPending();
    window.location.href = LMSAuth.homePage(user.role);
  });
</script>
</body>
</html>
