<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Password Reset | Far East e-Learning LMS</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="assets/css/theme.css" rel="stylesheet">
</head>
<body class="auth-body">

<div class="auth-wrap shadow" style="max-width:520px;grid-template-columns:1fr">
  <div class="auth-form">
    <div class="d-flex align-items-center gap-2 mb-4">
      <div class="auth-mark">FE</div>
      <div>
        <div class="fw-semibold" style="color:var(--lms-navy)">Reset your password</div>
        <div class="text-muted-sm">A reset link will be emailed to you</div>
      </div>
    </div>

    <form id="resetForm" novalidate>
      <div class="mb-3">
        <label class="form-label" for="email">Institutional email address</label>
        <div class="input-group">
          <span class="input-group-text bg-white"><i class="bi bi-envelope text-secondary"></i></span>
          <input type="email" class="form-control" id="email" placeholder="name@fareastelearning.ph" required>
        </div>
        <div class="form-text">The link expires after 30 minutes and can be used once.</div>
      </div>
      <button class="btn btn-primary w-100 py-2 mb-2" type="submit">Send reset link</button>
      <a href="index.html" class="btn btn-link w-100 text-decoration-none small">Back to sign in</a>
    </form>

    <div class="alert alert-success mt-3 py-2 small" id="sentNote" hidden>
      <i class="bi bi-check-circle me-1"></i> If that address exists, a reset link has been sent.
    </div>

    <div class="demo-note mt-3">
      <i class="bi bi-info-circle me-1"></i> Display only. No email is sent in this UI demo.
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.getElementById('resetForm').addEventListener('submit', function (ev) {
    ev.preventDefault();
    if (!this.checkValidity()) { this.classList.add('was-validated'); return; }
    document.getElementById('sentNote').hidden = false;
  });
</script>
</body>
</html>
